name: ci
on: [push, pull_request]
jobs:
  go:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: project}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.25.x", cache-dependency-path: project/go.sum}
      - run: make fmt-check
      - run: make vet
      - run: make test
