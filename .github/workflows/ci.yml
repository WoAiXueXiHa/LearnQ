name: ci
on: [push, pull_request]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.25.x", cache-dependency-path: go.sum}
      - run: make fmt-check
      - run: make vet
      - run: make test
      - run: GOWORK=off go test -race ./...
      - run: node --check internal/web/static/app.js
      - run: bash -n scripts/acceptance.sh scripts/manual-test.sh

  integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.10
        env:
          MYSQL_DATABASE: learnq
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7.2.14-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      LEARNQ_TEST_MYSQL_DSN: "root:root@tcp(127.0.0.1:3306)/learnq?parseTime=true&charset=utf8mb4&multiStatements=true"
      LEARNQ_TEST_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.25.x", cache-dependency-path: go.sum}
      - run: make test-integration

  acceptance:
    needs: [go, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make acceptance
